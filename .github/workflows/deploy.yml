name: Test, Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: bash test.sh

      - name: Build package
        run: |
          mkdir dist
          cp index.html style.css dist/
          
      - name: Debug variables
        run: |
          echo "Has role: ${{ vars.AWS_ROLE_ARN != '' }}"
          echo "Region: ${{ vars.AWS_REGION }}"
          echo "Bucket: ${{ vars.S3_BUCKET }}"
          echo "Role ARN: ${{ vars.AWS_ROLE_ARN }}"

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} --delete
